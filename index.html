<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Rastreio e Suporte</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header-icon">📦</div>
        <h1>Rastreamento de Encomendas</h1>
        
        <!-- Estado 1: Nenhum pacote sendo rastreado no momento -->
        <div id="identificacao-container">
            <p>Consulte o status da sua entrega e tire dúvidas em tempo real com nosso suporte:</p>
            <input type="text" id="campo-nome" placeholder="Nome do Destinatário (ex: Carlos)">
            <input type="text" id="campo-id" placeholder="Código de Rastreio / Pacote (ex: BR1005)">
            <button onclick="salvarEIniciar()">Rastrear Encomenda</button>
        </div>

        <!-- Estado 2: Pacote em acompanhamento (sessão ativa) -->
        <div id="sessao-ativa-container" style="display:none;">
            <div class="badge-status">Pacote em Acompanhamento</div>
            <p id="dados-salvos" class="dados-destaque"></p>
            <p class="status-verde">✔ Dados sincronizados com a central de atendimento.</p>
            <p class="instrucao-chat">Abra o chat no canto inferior para consultar detalhes ou falar com um especialista sobre esta entrega.</p>
            <button onclick="limparSessao()" class="btn-limpar">Rastrear Outro Pacote</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
