<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demonstração Chat Amazon Connect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Portal de Atendimento</h1>
        
        <!-- Estado 1: Utilizador sem sessão -->
        <div id="identificacao-container">
            <p>Preencha os seus dados antes de iniciar o chat:</p>
            <input type="text" id="campo-nome" placeholder="O seu Nome (ex: Vitor)">
            <input type="text" id="campo-id" placeholder="O seu E-mail ou ID (ex: 1005)">
            <button onclick="salvarEIniciar()">Guardar e Iniciar Chat</button>
        </div>

        <!-- Estado 2: Utilizador reconhecido -->
        <div id="sessao-ativa-container" style="display:none;">
            <p><strong>Bem-vindo(a) de volta!</strong></p>
            <p id="dados-salvos" class="dados-destaque"></p>
            <p class="status-verde">O chat reconhecerá a sua conta automaticamente.</p>
            <button onclick="limparSessao()" class="btn-limpar">Limpar Dados / Novo Utilizador</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
